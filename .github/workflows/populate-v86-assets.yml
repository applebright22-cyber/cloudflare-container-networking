name: Populate v86 Tiny Core assets

on:
  push:
    branches: [tinycore-persistent-node]
    paths:
      - ".github/workflows/populate-v86-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download v86 browser package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/v86 public/bios public/boot
          npm pack v86@latest
          tar -xzf v86-*.tgz
          cp package/build/libv86.js public/v86/libv86.js
          cp package/build/v86.wasm public/v86/v86.wasm

      - name: Download v86 BIOS files
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o public/bios/seabios.bin https://raw.githubusercontent.com/copy/v86/master/bios/seabios.bin
          curl -fL --retry 3 -o public/bios/vgabios.bin https://raw.githubusercontent.com/copy/v86/master/bios/vgabios.bin

      - name: Download Tiny Core 11.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o public/boot/TinyCore-11.0.iso https://i.copy.sh/TinyCore-11.0.iso

      - name: Remove placeholders
        shell: bash
        run: |
          rm -f public/v86/PUT-V86-FILES-HERE.txt
          rm -f public/bios/PUT-BIOS-FILES-HERE.txt
          rm -f public/boot/PUT-BOOT-FILE-HERE.txt
          rm -f public/boot/PUT-TINYCORE-HERE.txt

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/v86/libv86.js
          test -s public/v86/v86.wasm
          test -s public/bios/seabios.bin
          test -s public/bios/vgabios.bin
          test -s public/boot/TinyCore-11.0.iso
          file public/v86/libv86.js public/v86/v86.wasm public/bios/seabios.bin public/bios/vgabios.bin public/boot/TinyCore-11.0.iso
          ls -lh public/v86 public/bios public/boot

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v86 public/bios public/boot
          if git diff --cached --quiet; then
            echo "Assets already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add v86 and Tiny Core runtime assets"
          git push
