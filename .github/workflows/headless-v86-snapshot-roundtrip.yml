name: Workerd guest TCP HTTP HTTPS egress

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/src/headless-v86-snapshot-roundtrip-worker.ts"
      - "cloudflare/src/wisp-relay.ts"
      - "cloudflare/src/wisp-stream.ts"
      - ".github/workflows/headless-v86-snapshot-roundtrip.yml"

jobs:
  guest-snapshot-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run storage, loader, and browser GUI regression tests
        run: npm run test:headless && node --test ../tests/bootstrap-controller.test.mjs
      - name: Build the Worker-compatible v86 bundle
        run: npm run build:headless-v86
      - name: Compile the snapshot round-trip Worker without deploying
        run: npx wrangler deploy --dry-run --config wrangler.headless-v86-roundtrip.toml
      - name: Start local Workerd snapshot round-trip Worker
        shell: bash
        run: |
          set -euo pipefail
          setsid timeout --signal=TERM --kill-after=15s 1800s npx wrangler dev --local --config wrangler.headless-v86-roundtrip.toml --ip 127.0.0.1 --port 8789 > /tmp/v86-roundtrip-workerd.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill -- "-$worker_pid" 2>/dev/null || kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8789/ready > /tmp/v86-roundtrip-ready.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Workerd did not become ready; logs follow:"
            cat /tmp/v86-roundtrip-workerd.log
            exit 1
          fi
          cat /tmp/v86-roundtrip-ready.json
          set +e
          curl --silent --show-error --fail-with-body --max-time 1500 -X POST -H 'content-type: application/json' -d '{"identity":"test-v86-roundtrip"}' http://127.0.0.1:8789/run -o /tmp/v86-roundtrip-result.json &
          request_pid=$!
          while kill -0 "$request_pid" 2>/dev/null; do
            if curl --silent --show-error --fail --max-time 3 "http://127.0.0.1:8789/progress?identity=test-v86-roundtrip" -o /tmp/v86-roundtrip-progress.json 2>/dev/null; then
              node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("/tmp/v86-roundtrip-progress.json","utf8")); console.log("GUEST_PROGRESS",JSON.stringify({status:p.status,step:p.step,stage:p.stage,stage_status:p.stage_status,stage_error:p.stage_error,boot_wait_seconds:p.boot_wait_seconds,boot_screen_unchanged_seconds:p.boot_screen_unchanged_seconds,stages:p.stages,snapshot_roundtrip:p.snapshot_roundtrip}));'
            fi
            sleep 10
          done
          wait "$request_pid"
          curl_rc=$?
          set -e
          cat /tmp/v86-roundtrip-result.json 2>/dev/null || true
          echo "----- Workerd relay/runtime diagnostics -----"
          cat /tmp/v86-roundtrip-workerd.log
          echo "----- End Workerd diagnostics -----"
          if [ "$curl_rc" -ne 0 ]; then
            echo "Guest egress request failed (curl exit $curl_rc); see progress and Workerd diagnostics above."
            exit "$curl_rc"
          fi
          node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("/tmp/v86-roundtrip-result.json", "utf8")); const s = r.stages ?? {}; const ok = r.probe === "tinycore-tcp-http-https-egress" && r.runtime === "workerd" && r.passed === true && r.guest_booted === true && r.guest_checks_passed === true && s.dhcp?.passed === true && s.http_preflight?.passed === true && s.https_preflight?.passed === true; if (!ok) { console.error("TinyCore TCP/HTTP/HTTPS egress acceptance failed", r); process.exit(1); } console.log("PASS: TinyCore boot, DHCP, external TCP/HTTP, and external TCP/HTTPS egress.");'
          cleanup
          trap - EXIT
