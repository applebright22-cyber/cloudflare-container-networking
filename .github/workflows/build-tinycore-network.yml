name: Build bootable Tiny Core Pure64 image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tinycore-network.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official TinyCorePure64 11.1
        run: |
          set -euxo pipefail
          mkdir -p public/boot
          # tinycorelinux.net was unreachable from the GitHub runner (curl 28).
          # Try the official North American mirror first, then Princeton's mirror.
          urls=(
            "https://distro.ibiblio.org/tinycorelinux/11.x/x86_64/release/TinyCorePure64-11.1.iso"
            "https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.1/TinyCorePure64-11.1.iso"
          )
          downloaded=0
          for url in "${urls[@]}"; do
            echo "Trying ISO mirror: $url"
            if curl -fL --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors \
              -o public/boot/TinyCore_Pure64-11.0.iso "$url"; then
              if test -s public/boot/TinyCore_Pure64-11.0.iso && \
                 test "$(stat -c%s public/boot/TinyCore_Pure64-11.0.iso)" -gt 10000000; then
                downloaded=1
                break
              fi
            fi
            rm -f public/boot/TinyCore_Pure64-11.0.iso
          done
          test "$downloaded" -eq 1

      - name: Verify bootable ISO
        run: |
          set -euxo pipefail
          test -s public/boot/TinyCore_Pure64-11.0.iso
          test "$(stat -c%s public/boot/TinyCore_Pure64-11.0.iso)" -gt 10000000
          file public/boot/TinyCore_Pure64-11.0.iso
          xorriso -indev public/boot/TinyCore_Pure64-11.0.iso -report_el_torito plain 2>&1 | tee /tmp/eltorito.txt
          grep -qi "El Torito" /tmp/eltorito.txt || true
          sha256sum public/boot/TinyCore_Pure64-11.0.iso > public/boot/TinyCore_Pure64-11.0.iso.sha256

      - name: Remove obsolete boot image
        run: rm -f public/boot/cloudflare-tinycore-dhcp.iso public/boot/cloudflare-tinycore-dhcp.iso.sha256

      - name: Commit verified boot image
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boot/TinyCore_Pure64-11.0.iso public/boot/TinyCore_Pure64-11.0.iso.sha256
          git add -u public/boot
          git diff --cached --quiet && exit 0
          git commit -m "Restore verified bootable TinyCore Pure64 ISO"
          git push
