name: Build bootable Tiny Core Pure64 image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tinycore-network.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-tinycore-network.yml"
  workflow_dispatch:

jobs:
  boot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official TinyCorePure64 11.1
        run: |
          set -euxo pipefail
          mkdir -p build-artifacts
          # Keep this larger reference ISO outside public/, which Wrangler uploads
          # as Worker static assets. The running v86 dashboard uses the separate
          # 16 MiB experimental network ISO in public/boot/.
          urls=(
            "https://distro.ibiblio.org/tinycorelinux/11.x/x86_64/release/TinyCorePure64-11.1.iso"
            "https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.1/TinyCorePure64-11.1.iso"
          )
          downloaded=0
          for url in "${urls[@]}"; do
            echo "Trying ISO mirror: $url"
            if curl -fL --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors \
              -o build-artifacts/TinyCore_Pure64-11.0.iso "$url"; then
              if test -s build-artifacts/TinyCore_Pure64-11.0.iso && \
                 test "$(stat -c%s build-artifacts/TinyCore_Pure64-11.0.iso)" -gt 10000000; then
                downloaded=1
                break
              fi
            fi
            rm -f build-artifacts/TinyCore_Pure64-11.0.iso
          done
          test "$downloaded" -eq 1

      - name: Install ISO inspection tool
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Verify bootable ISO
        run: |
          set -euxo pipefail
          test -s build-artifacts/TinyCore_Pure64-11.0.iso
          test "$(stat -c%s build-artifacts/TinyCore_Pure64-11.0.iso)" -gt 10000000
          file build-artifacts/TinyCore_Pure64-11.0.iso
          xorriso -indev build-artifacts/TinyCore_Pure64-11.0.iso -report_el_torito plain 2>&1 | tee /tmp/eltorito.txt
          grep -qi "El Torito" /tmp/eltorito.txt || true
          sha256sum build-artifacts/TinyCore_Pure64-11.0.iso > build-artifacts/TinyCore_Pure64-11.0.iso.sha256

      - name: Upload verified reference ISO
        uses: actions/upload-artifact@v4
        with:
          name: tinycore-pure64-reference-iso
          path: |
            build-artifacts/TinyCore_Pure64-11.0.iso
            build-artifacts/TinyCore_Pure64-11.0.iso.sha256
          if-no-files-found: error
          retention-days: 7
