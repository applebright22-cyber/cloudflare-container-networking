name: Worker headless v86 spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "public/v86/libv86.js"
      - "public/vm.html"
      - "tests/v86-doh-resilience.test.mjs"
      - "tests/v86-restored-shell-verification.test.mjs"
      - "tests/app-persistence-and-v86-loader.test.mjs"
      - ".github/workflows/headless-v86-spike.yml"
  push:
    branches: [main, experiment/worker-headless-v86, experiment/worker-compiled-v86-wasm]
    paths:
      - "cloudflare/**"
      - "public/v86/libv86.js"
      - "public/vm.html"
      - "tests/v86-doh-resilience.test.mjs"
      - "tests/v86-restored-shell-verification.test.mjs"
      - ".github/workflows/headless-v86-spike.yml"

jobs:
  browser-doh-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser v86 bundle syntax
        run: node --check public/v86/libv86.js
      - name: Test DNS resolver failover and restored guest-shell verification
        run: node --test tests/v86-doh-resilience.test.mjs tests/v86-restored-shell-verification.test.mjs tests/app-persistence-and-v86-loader.test.mjs

  loader-tests-and-worker-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare static Worker WASM module
        run: npm run prepare:worker-wasm
      - name: Test Worker asset loader
        run: npm run test:headless
      - name: Build upstream v86 candidate bundle
        run: npm run build:headless-v86
      - name: Upload candidate bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: headless-v86-candidate-bundle
          path: cloudflare/dist/headless-v86-bundle.js
          if-no-files-found: error
          retention-days: 7
      - name: Bundle Worker without deploying (Free-compatible config)
        run: npm run check
      - name: Smoke-test v86 and static WASM module inside local Workerd
        shell: bash
        run: |
          set -euo pipefail
          # Bound the server lifetime so a Wrangler/Workerd startup hang cannot stall CI.
          timeout --signal=TERM --kill-after=5s 45s npx wrangler dev --local --config wrangler.headless-v86-smoke.toml --ip 127.0.0.1 --port 8788 > /tmp/headless-v86-workerd.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8788/ > /tmp/headless-v86-workerd.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Workerd smoke test did not become ready within 30 seconds. Wrangler/Workerd log follows:"
            cat /tmp/headless-v86-workerd.log
            exit 1
          fi
          cat /tmp/headless-v86-workerd.json
          node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("/tmp/headless-v86-workerd.json", "utf8")); if (r.probe !== "headless-v86-emulator-initialization" || r.runtime !== "workerd" || r.wasm_module_loaded !== true || r.wasm_import_count < 1 || r.wasm_export_count < 1 || r.static_module_instantiated !== true || r.emulator_initialized !== true) { console.error("Unexpected or failed Workerd v86 emulator initialization probe", r); process.exit(1); }'
          cleanup
          trap - EXIT

  wisp-tcp-http-https-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build Worker
        run: npm install && npm run build:headless-v86
      - name: Verify external TCP HTTP and HTTPS through the WISP relay
        shell: bash
        run: |
          set -euo pipefail
          setsid timeout --signal=TERM --kill-after=10s 480s npx wrangler dev --local --config wrangler.headless-v86-roundtrip.toml --ip 127.0.0.1 --port 8789 > /tmp/wisp-egress-workerd.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill -- "-$worker_pid" 2>/dev/null || kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8789/ready > /tmp/wisp-egress-ready.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "WISP Workerd test server failed to become ready:"
            cat /tmp/wisp-egress-workerd.log
            exit 1
          fi
          cat /tmp/wisp-egress-ready.json
          WORKER_BASE_URL=http://127.0.0.1:8789 node test/wisp-egress.integration.mjs
          cleanup
          trap - EXIT
          echo "----- Workerd diagnostics -----"
          cat /tmp/wisp-egress-workerd.log
          echo "----- End Workerd diagnostics -----"
