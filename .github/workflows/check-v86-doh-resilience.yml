name: Check v86 DNS-over-HTTPS resilience

on:
  push:
    branches: [main]
    paths:
      - "public/v86/libv86.js"
      - "tests/v86-doh-resilience.test.mjs"
      - ".github/workflows/check-v86-doh-resilience.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/v86/libv86.js"
      - "tests/v86-doh-resilience.test.mjs"
      - ".github/workflows/check-v86-doh-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser bundle syntax
        run: node --check public/v86/libv86.js
      - name: Test DNS resolver failover and errors
        run: node --test tests/v86-doh-resilience.test.mjs
