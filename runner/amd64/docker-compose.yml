services:
  mysterium-node:
    build:
      context: ../../cloudflare
      dockerfile: Dockerfile
    container_name: mysterium-node-${NODE_ID}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NODE_ID: ${NODE_ID}
      CLOUDFLARE_API_URL: ${CLOUDFLARE_API_URL}
      RUNNER_HEARTBEAT_SECONDS: ${RUNNER_HEARTBEAT_SECONDS:-10}
    volumes:
      - mysterium-data:/var/lib/mysterium-node

volumes:
  mysterium-data:
